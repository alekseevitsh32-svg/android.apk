name: Build Android APK
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ИСПРАВЛЕНО: Ставим Java 21, чтобы прочитать новейшую библиотеку bcprov
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare WWW Folder
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp app.js www/
          cp privacy.html www/

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android
          npx cap init "Выгодный Шоппинг" "ru.dima.smartshopping" --web-dir=www

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate App Icons
        run: |
          npm install @capacitor/assets
          npx capacitor-assets generate --icon
        continue-on-error: true

      - name: Sync Code to Android
        run: npx cap sync android

      # ИСПРАВЛЕНО: Прописываем Java 21 во все конфигурационные файлы проекта Android
      - name: Force Java 21 in Android Project
        run: |
          echo "org.gradle.java.home=/usr/lib/jvm/temurin-21-jdk-amd64" >> android/gradle.properties
          sed -i 's/compatibility = .*/compatibility = JavaVersion.VERSION_21/g' android/app/build.gradle || true

      - name: Build Android Release APK
        run: |
          cd android && ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
